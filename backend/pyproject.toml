[project]
name = "study-buddy-backend"
version = "0.1.0"
description = "API for Study Buddy, where students explain topics from memory to an AI classmate."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "pyjwt>=2.15,<3",
    "argon2-cffi>=25.1,<26",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Plain asserts are how pytest checks results, and tests use fake passwords on purpose
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
