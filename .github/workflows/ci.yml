name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: study_buddy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d study_buddy_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values for the CI-only database, not real secrets
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/study_buddy_ci
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/study_buddy_ci
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests gateway
      # Migrations must apply cleanly, reverse cleanly and match the models
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check
      # Tests create and drop their own tables, so reset the schema first
      - run: alembic downgrade base
      - run: pytest

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip install -e "backend[dev]"
      - run: pip-audit
      # TODO: make this blocking once the Expo CLI's zod advisory is patched upstream
      - run: npm audit --omit=dev --audit-level=high
        working-directory: mobile
        continue-on-error: true
